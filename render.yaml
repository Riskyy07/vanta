services:
  - type: web
    name: vanta-web
    runtime: node
    region: singapore
    plan: 1c-2g
    buildCommand: npm install --no-audit --no-fund && npm run build
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vanta-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: BLOCKSCOUT_API_BASE_URL
        value: https://api.blockscout.com/8453/api/v2
      - key: BLOCKSCOUT_CHAIN_ID
        value: "8453"
      - key: BLOCKSCOUT_API_KEY
        sync: false
      - key: VANTA_WALLETS
        sync: false
      - key: VANTA_REQUIRE_LIVE_DATA
        value: "true"
      - key: VANTA_MONITORING_SECRET
        generateValue: true

  - type: worker
    name: vanta-worker
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm run migrate && npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vanta-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: BLOCKSCOUT_API_BASE_URL
        value: https://api.blockscout.com/8453/api/v2
      - key: BLOCKSCOUT_CHAIN_ID
        value: "8453"
      - key: BLOCKSCOUT_API_KEY
        sync: false
      - key: VANTA_WALLETS
        sync: false
      - key: VANTA_REQUIRE_LIVE_DATA
        value: "true"
  - type: cron
    name: vanta-e2e-check
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    schedule: "*/30 * * * *"
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm run e2e:live
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vanta-db
          property: connectionString
      - key: BLOCKSCOUT_API_BASE_URL
        value: https://api.blockscout.com/8453/api/v2
      - key: BLOCKSCOUT_CHAIN_ID
        value: "8453"
      - key: BLOCKSCOUT_API_KEY
        sync: false
      - key: VANTA_WALLETS
        sync: false
      - key: VANTA_REQUIRE_LIVE_DATA
        value: "true"

databases:
  - name: vanta-db
    region: singapore
    plan: 0.1c-256mb
    databaseName: vanta
    user: vanta
    postgresMajorVersion: "17"
    # VANTA uses session-level PostgreSQL advisory locks in the ingestion worker
    # Render transaction pooling is not compatible with session-level advisory locks
    connectionPool: none
